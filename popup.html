<!-- popup.html -->
<!DOCTYPE html>
<html>
<head>
  <title>SecurePass Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>SecurePass Manager</h1>
    </header>
    
    <div class="tabs">
      <button class="tab-btn active" data-tab="saved">Saved Passwords</button>
      <button class="tab-btn" data-tab="add">Add New</button>
    </div>
    
    <div id="saved" class="tab-content active">
      <div class="search-container">
        <input type="text" id="search" placeholder="Search websites...">
      </div>
      <div id="passwordList" class="password-list">
        <!-- Passwords will be listed here -->
      </div>
    </div>
    
    <div id="add" class="tab-content">
      <form id="addPasswordForm">
        <div class="form-group">
          <label for="website">Website URL</label>
          <input type="url" id="website" required placeholder="https://example.com">
        </div>
        <div class="form-group">
          <label for="username">Username/Email</label>
          <input type="text" id="username" required placeholder="username@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-input">
            <input type="password" id="password" required>
            <button type="button" id="togglePassword" class="toggle-btn">View</button>
          </div>
        </div>
        <button type="submit" class="btn-save">Save Password</button>
      </form>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
